[project]
name = "mindbase-worker"
version = "0.1.0"
description = "Mindbase background processing worker"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "mindbase-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindbase_worker"]

[tool.uv.sources]
mindbase-shared = { workspace = true }
