[project]
name = "mindbase-collector"
version = "0.1.0"
description = "CLI collector for Mindbase"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mindbase-shared",
]

[project.scripts]
mindbase = "mindbase_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindbase_collector"]

[tool.uv.sources]
mindbase-shared = { workspace = true }
