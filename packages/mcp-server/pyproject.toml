[project]
name = "mindbase-mcp"
version = "0.1.0"
description = "MCP server for Mindbase context access"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mindbase-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindbase_mcp"]

[tool.uv.sources]
mindbase-shared = { workspace = true }
