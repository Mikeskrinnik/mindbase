[project]
name = "mindbase-sync-agent"
version = "0.1.0"
description = "Obsidian + iCloud sync agent for Mindbase"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "click>=8.1.0",
    "watchdog>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "mindbase-shared",
]

[project.scripts]
mindbase-sync = "mindbase_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindbase_sync"]

[tool.uv.sources]
mindbase-shared = { workspace = true }
